<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
        .send-button{
            background-color: rgb(25,135,84);
            color: white;
            padding: 12px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px; 
            cursor: pointer;
        }
        .chat-input{
            
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"> </script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    function ChatInput({chatMessages, setChatMessages}){
        const [inputText, setInputText]=React.useState('');
        function saveInputText(event){
            setInputText(event.target.value); 
        }

        function sendMessage() {
            const newChatMessages=[
            ...chatMessages, //spread operator
            {
                message:inputText, 
                sender:'user', 
                id: crypto.randomUUID()
            }
            ];
            setChatMessages(newChatMessages); 

            const response=Chatbot.getResponse(inputText);
            
            setChatMessages([
            ...newChatMessages, //spread operator
            {
                message:response, 
                sender:'robot', 
                id: crypto.randomUUID()
            }
            ]); 

            setInputText('');
        }
        return (
            <>
                <input 
                placeholder="Send a message to chatbot" 
                size="30" 
                onChange={saveInputText}
                value={inputText}
                className="chat-input"
                />
                <button 
                onClick={sendMessage}
                className="send-button"
                >Send</button>
            </>
        );
    }

    function ChatMessage({message,sender}) {
        return (
            <div>
                {sender ==='robot' && (
                    <img src="robot.png" width="50" />
                )}
                {message}
                {sender ==='user' && (
                    <img src="user.png" width="50" />
                )}
            </div>
        );
    }

    function ChatMessages ({chatMessages}) {
        return (
            <>
            {chatMessages.map((chatMessage)=>{
                return (
                    <ChatMessage 
                    message={chatMessage.message} 
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                    />
                );
            })}
            </>
        )
    }

    function App(){
        // relift the state into app, that can be shared into <App>'s components
        const [chatMessages, setChatMessages]=React.useState( //useState return an array
        [
        {
            message:'hello chatbot',
            sender:'user',
            id:'id1'
        },
        {
            message:'How can I help you?', 
            sender: 'robot',
            id:'id2'
        }, 
        {
            message: 'Can you get me todays date',
            sender:'user',
            id:'id3'
        }, 
        {
            message: 'Today is 10 June', 
            sender: 'robot',
            id:'id4'
        }
        ]);
        return (
            <>
                <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
                <ChatMessages chatMessages={chatMessages} />
            </>
        ); 
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
